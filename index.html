<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      viewport-fit=cover lets the page draw edge to edge: into the notch and home-indicator areas,
      and behind Safari's toolbars, instead of being letterboxed inside them.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>viewport-fit=cover demo: gradient</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      /*
       * The sky is the page's own background, not a fixed layer. Safari tints its toolbars from fixed
       * elements touching the screen's edges, so a fixed full-screen background turns the bars solid.
       * Painted on the root instead, it scrolls with the page and shows through behind the toolbars:
       * day for the first screen (lvh, the screen with the toolbars hidden), night by the end. The
       * gradient would paint the same from body; the solid colour under it belongs on html, which is
       * the page's colour once html has any background.
       */
      html {
        background: var(--day-top)
          linear-gradient(
            var(--day-top),
            var(--day-bottom) 100lvh,
            var(--night-top) 75%,
            var(--night-bottom)
          )
          no-repeat;
      }
    </style>
  </head>
