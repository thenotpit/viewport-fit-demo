<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      The default viewport, viewport-fit=auto: the page is letterboxed inside the status bar and
      Safari's toolbars, and Safari paints them itself. This page gives it two faint strips to paint
      them from.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>viewport-fit=cover demo: viewport auto, strips</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      /*
       * No gradient: the page is one solid color, the same color Safari reads for the strip behind
       * the status bar and the area past either end. The shared scroll-driven animation carries it
       * from the blue at the top of the page to the night at the bottom.
       */
      html {
        background-color: var(--day-top);
      }

      /*
       * Two faint strips, one per screen edge. Safari reads a fixed element touching an edge for its
       * bars, and reads it again whenever it repaints, so the strips run the same scroll-driven
       * keyframes as html and are always the page's own color. It reads the color value, not the
       * pixels: opacity 0.1 is the floor, and a mask can fade the inner edge. Measured on an iPhone,
       * in Safari and in X's in-app browser: Safari reads a strip of 12px, X needs 20px, and X does not
       * read a box that starts past the screen's edge. The soft inner edge is a mask rather than a
       * blur because a blur fades at the screen edge too, and hiding that fade needs the overhang X
       * won't read. The strips sit above the header because Safari reads whatever is topmost at the
       * center of the edge.
       */
      .edge {
        position: fixed;
        left: 0;
        right: 0;
        z-index: 2;
        pointer-events: none;
        background-color: var(--day-top);
        opacity: 0.1;
      }

      .edge-top {
        top: 0;
        height: 20px;
        mask-image: linear-gradient(to bottom, #000, transparent);
      }

      .edge-bottom {
        bottom: 0;
        height: 20px;
        mask-image: linear-gradient(to top, #000, transparent);
      }

      @supports (animation-timeline: scroll()) {
        .edge {
          animation: page-color linear both;
          animation-timeline: scroll(root);
        }
      }
    </style>
  </head>

    <div class="edge edge-bottom" aria-hidden="true"></div>
