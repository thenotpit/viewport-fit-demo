<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      The default viewport, viewport-fit=auto: the page is letterboxed inside the status bar and
      Safari's toolbars, and Safari paints them from the two strips at the screen's edges. Each strip
      follows the color the gradient has at its own edge of the screen.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>viewport-fit=cover demo: gradient</title>
    <link rel="stylesheet" href="styles.css?v=58547e38" />
    <style>
      /*
       * The sky is the page's own background, not a fixed layer. Safari tints its toolbars from fixed
       * elements touching the screen's edges, so a fixed full-screen background turns the bars solid.
       * Painted on the root instead, it scrolls with the page and shows through behind the toolbars:
       * day for the first screen (lvh, the screen with the toolbars hidden), night by the end. The
       * gradient would paint the same from body; the solid color under it belongs on html, which is
       * the page's color once html has any background.
       */
      html {
        background: var(--day-top)
          linear-gradient(
            var(--day-top),
            var(--day-bottom) 100lvh,
            var(--night-top) 75%,
            var(--night-bottom)
          )
          no-repeat;
      }

      /*
       * The strips trace the gradient. Safari reads a strip's background-color value, not its
       * pixels, and a strip carrying the gradient itself would be sampled once and held, so each
       * strip animates its color through the gradient's stops, placed where its own edge of the
       * screen meets them during the scroll. The page is 520 screen heights tall, in lvh like the
       * gradient's first stop, and the scroll covers 420 of them once the toolbar has collapsed. The top edge starts at the day's blue, meets the pink at one screen
       * height, 23.81% of the scroll, the night's top at 75% of the page, 92.86%, and ends 23.08% of
       * the way from there to the night's bottom. The bottom edge starts one screen down, already at
       * the pink, meets the night's top at 69.05%, and ends on the night's bottom. The gradient and
       * the animation both interpolate linearly in sRGB, so the strips match the page.
       */
      /* Test: the strips themselves visible, to compare against the gradient beside them. */
      .edge {
        opacity: 1;
        mask-image: none;
      }

      @supports (animation-timeline: scroll()) {
        .edge-top {
          animation-name: edge-top-color;
        }

        .edge-bottom {
          animation-name: edge-bottom-color;
        }
      }

      @keyframes edge-top-color {
        from {
          background-color: var(--day-top);
        }
        23.81% {
          background-color: var(--day-bottom);
        }
        92.86% {
          background-color: var(--night-top);
        }
        to {
          /* 23.08% of the way from --night-top to --night-bottom. A plain color, because a
             color-mix() stop would make the animation interpolate in oklab, off the gradient. */
          background-color: #180d33;
        }
      }

      @keyframes edge-bottom-color {
        from {
          background-color: var(--day-bottom);
        }
        69.05% {
          background-color: var(--night-top);
        }
        to {
          background-color: var(--night-bottom);
        }
      }
    </style>
  </head>
